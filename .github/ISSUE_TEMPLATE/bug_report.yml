name: Bug report
description: Something broke or looks wrong
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the bug in a sentence or two.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Tap ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - iPhone
        - Android
        - Desktop / web
        - Other
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshots or screen recording
      description: Drag and drop files here.
